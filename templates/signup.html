{% extends "base.html" %}

{% block content %}
<section class="min-h-screen flex items-center justify-center luxury-gradient pt-32 px-4 relative overflow-hidden">

    <!-- Ambient Glow -->
    <div class="absolute top-[-120px] left-[-120px] w-[420px] h-[420px] bg-purple-500/20 blur-[120px] rounded-full"></div>
    <div class="absolute bottom-[-150px] right-[-100px] w-[350px] h-[350px] bg-pink-500/10 blur-[120px] rounded-full"></div>

     <div class="max-w-md w-full p-10 rounded-[2.5rem] text-white border border-white/10 bg-black/20 backdrop-blur-xl shadow-2xl shadow-purple-900/30 relative z-10 transition-all duration-300">

        <div class="text-center mb-10">
            <h2 class="text-4xl font-bold mb-3 tracking-tight">
                Join Us
            </h2>

            <p class="text-white/60 text-base">
                Create your account to start planning.
            </p>
        </div>

        {% with messages = get_flashed_messages() %}
          {% if messages %}
            {% for message in messages %}
              <div class="bg-red-500/20 border border-red-500/50 text-red-200 px-4 py-3 rounded-xl mb-6 text-sm backdrop-blur-md">
                {{ message }}
              </div>
            {% endfor %}
          {% endif %}
        {% endwith %}

        <form action="/signup" method="POST" class="space-y-6">

            <div>
                <label class="block text-sm font-semibold mb-2 ml-1 text-white/90">
                    Username
                </label>

                <input
                    type="text"
                    name="username"
                    required
                    placeholder="Choose a username"

                    class="w-full bg-white/10 border border-white/10 rounded-2xl px-6 py-4 text-white placeholder-white/35 backdrop-blur-md transition-all duration-300 focus:outline-none focus:ring-2 focus:ring-purple-500/40 focus:border-purple-400 focus:bg-white/15"
                >
            </div>

            <div>
                <label class="block text-sm font-semibold mb-2 ml-1 text-white/90">
                    Email
                </label>

                <input
                    type="email"
                    name="email"
                    required
                    placeholder="Email address"

                    class="w-full bg-white/10 border border-white/10 rounded-2xl px-6 py-4 text-white placeholder-white/35 backdrop-blur-md transition-all duration-300 focus:outline-none focus:ring-2 focus:ring-purple-500/40 focus:border-purple-400 focus:bg-white/15"
                >
            </div>

            <div>
                <label class="block text-sm font-semibold mb-2 ml-1 text-white/90">
                    Password
                </label>

                <input
                    type="password"
                    name="password"
                    required
                    placeholder="••••••••"

                    class="w-full bg-white/10 border border-white/10 rounded-2xl px-6 py-4 text-white placeholder-white/35 backdrop-blur-md transition-all duration-300 focus:outline-none focus:ring-2 focus:ring-purple-500/40 focus:border-purple-400 focus:bg-white/15"
                >
            </div>

            <button
                type="submit"

                class="w-full py-4 rounded-2xl font-bold text-white text-lg bg-gradient-to-r from-purple-500 to-pink-500 shadow-xl shadow-purple-500/30 hover:scale-[1.02] hover:shadow-purple-500/40 transition-all duration-300"
            >
                Create Account
            </button>

        </form>

        <p class="text-center mt-8 text-white/50 text-sm">
            Already have an account?

            <a
                href="/signin"
                class="text-purple-300 font-bold hover:text-pink-300 transition-colors duration-300"
            >
                Sign In
            </a>
        </p>

    </div>
</section>
{% endblock %}
